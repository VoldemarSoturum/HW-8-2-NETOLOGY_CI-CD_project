name: Django CI

on:
  push:          # запускать при любом push
  pull_request:  # и при PR

jobs:
  tests:
    runs-on: ubuntu-latest

    # Поднимаем PostgreSQL как сервис для тестов
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: stocks_test_db
          POSTGRES_USER: stocks_user
          POSTGRES_PASSWORD: stocks_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U stocks_user -d stocks_test_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    # Переменные окружения для твоего settings.py (load_dotenv + os.getenv)
    env:
      SECRET_KEY: "fake-ci-secret-key"
      DEBUG: "False"
      ALLOWED_HOSTS: "localhost,127.0.0.1"

      DB_NAME: "stocks_test_db"
      DB_USER: "stocks_user"
      DB_PASSWORD: "stocks_password"
      DB_HOST: "127.0.0.1"
      DB_PORT: "5432"

    # ВСЕ команды выполняем внутри папки с проектом
    defaults:
      run:
        working-directory: EX1+ADDIONS-Stocks_products

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Django 3.2 официально поддерживает Python до 3.10 — берём его
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: |
          python manage.py migrate --noinput

      - name: Run tests
        run: |
          python manage.py test
